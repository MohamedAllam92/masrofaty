<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مصروفاتي</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مصروفاتي">
<meta name="theme-color" content="#1E6A4C">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#EEF2EE;--surface:#fff;--ink:#16241D;--muted:#5E6E65;--line:#D5DDD7;--accent:#1E6A4C;--brass:#A87A22;--soft:#E1EBE4;--danger:#B3402F}
@media (prefers-color-scheme:dark){:root{--bg:#0F1612;--surface:#17211B;--ink:#E6EEE8;--muted:#97A89E;--line:#2A3830;--accent:#4FB287;--brass:#D9A84A;--soft:#1F2D25;--danger:#E07563}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"SF Arabic","Geeza Pro",Tahoma,sans-serif;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 30px)}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:1.5rem}
.gear{border:none;background:none;font-size:1.4rem;color:var(--muted);padding:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.mic{width:150px;height:150px;border-radius:50%;border:none;margin:6px auto;background:var(--accent);color:#fff;font-size:3.4rem;
  display:grid;place-items:center;box-shadow:0 8px 24px rgba(30,106,76,.35);transition:transform .15s}
.mic.rec{background:var(--danger);animation:pulse 1.2s infinite}
.mic.busy{background:var(--brass);animation:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.hint{text-align:center;color:var(--muted);font-size:.95rem;min-height:1.6em}
.hint.err{color:var(--danger)}
.said{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.95rem}
.said:empty{display:none}
.it{display:grid;grid-template-columns:1fr 96px 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.it .sel{grid-column:1 / -1;display:flex;gap:8px}
.it .sel select{flex:1;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:7px 9px;min-width:0;width:100%}
textarea{min-height:64px;resize:vertical}
.x{border:none;background:none;color:var(--danger);font-size:1.4rem;padding:0}
.in input[type=number]{color:var(--accent)}
.sum{display:flex;justify-content:space-between;font-weight:700}
.row{display:flex;gap:8px;align-items:center}
button.p{flex:1;border:none;border-radius:11px;padding:12px;font:inherit;font-weight:700;font-size:1.05rem;background:var(--accent);color:#fff}
button.s{border:1.5px solid var(--line);border-radius:11px;padding:11px 14px;font:inherit;background:var(--surface);color:var(--ink)}
button:disabled{opacity:.5}
details summary{cursor:pointer;color:var(--muted);font-size:.95rem}
.rc{display:grid;grid-template-columns:1fr auto;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.rc small{color:var(--muted);grid-column:1}
.rc b{grid-row:1 / 3;grid-column:2;align-self:center}
.rc.in b{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:10px}
label{font-weight:600;font-size:.95rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>مصروفاتي</h1><button class="gear" id="gear" aria-label="الإعدادات">⚙️</button></header>

  <section class="card" id="setup" hidden>
    <b>إعداد أول مرة</b>
    <label for="url">لينك الربط (Apps Script)</label>
    <input id="url" type="url" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec">
    <label for="pin">الرقم السري</label>
    <input id="pin" type="password" inputmode="numeric" dir="ltr">
    <div class="row"><button class="p" id="saveSet">احفظ وجرّب</button></div>
    <div class="hint" id="setMsg"></div>
  </section>

  <section class="card" id="main" hidden>
    <button class="mic" id="mic" aria-label="سجّل بصوتك">🎤</button>
    <div class="hint" id="hint">دوس واتكلم بالعامية، ودوس تاني لما تخلص</div>
    <details><summary>أو اكتب بإيدك</summary>
      <div class="row" style="margin-top:8px"><textarea id="typed" placeholder="مثلاً: جبت عيش بعشرة واديت المدام ألفين"></textarea></div>
      <div class="row" style="margin-top:8px"><button class="s" id="goTyped">افهم</button></div>
    </details>
  </section>

  <section class="card" id="review" hidden>
    <div class="said" id="said"></div>
    <div id="items"></div>
    <div class="sum"><span>الإجمالي</span><span id="tot"></span></div>
    <div class="row"><label for="day" style="flex:none">التاريخ</label><input type="date" id="day"></div>
    <div class="row"><button class="p" id="save">احفظ</button><button class="s" id="cancel">إلغاء</button></div>
  </section>

  <section class="card" id="recentC" hidden>
    <b>آخر اللي اتسجل</b>
    <div id="recent"></div>
  </section>
</div>

<script>
const CATS=["مصروف البيت","بقالة وسوبرماركت","خضار وفاكهة","لحوم وفراخ وسمك","عيش وفطار","أكل برا وديليفري","قهوة وشاي ومشروبات","حلويات وتسالي","مواصلات","عربية وبنزين","إيجار وأقساط سكن","كهربا وميه وغاز","تليفون ونت","صيانة وتصليحات","أدوات منزلية ومنظفات","أولاد ومدارس","دروس وتعليم","دكاترة وتحاليل","أدوية وصيدلية","حلاقة وعناية شخصية","لبس وجزم","خروجات وترفيه","سفر ومصايف","هدايا ومناسبات","صدقات وزكاة","جمعيات وأقساط","اشتراكات ونادي","سجاير","شغل ومصاريف مهنية"];
const INC=["مرتب","دخل إضافي"];
const $=id=>document.getElementById(id);
const AR=n=>(Math.round(n*100)/100).toLocaleString("ar-EG");
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const DIG=s=>String(s).replace(/[0-9]/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const dFull=s=>{const [y,m,d]=String(s).split("-");return d?DIG(y+"/"+m+"/"+d):DIG(s)};
let cfg={}; try{cfg=JSON.parse(localStorage.getItem("cfg")||"{}")}catch(e){}
let draft=[], said="";

function hint(t,err){const h=$("hint");h.textContent=t;h.className="hint"+(err?" err":"")}
async function api(body){
  const r=await fetch(cfg.url,{method:"POST",body:JSON.stringify({...body,pin:cfg.pin})});
  const j=await r.json(); if(!j.ok) throw new Error(j.error||"error"); return j;
}
function show(){
  const ok=cfg.url&&cfg.pin;
  $("setup").hidden=!!ok; $("main").hidden=!ok; $("recentC").hidden=!ok;
  if(ok) loadRecent();
}
$("gear").onclick=()=>{$("url").value=cfg.url||"";$("pin").value=cfg.pin||"";$("setup").hidden=!$("setup").hidden};
$("saveSet").onclick=async()=>{
  const u=$("url").value.trim(), p=$("pin").value.trim();
  if(!/^https:\/\/script\.google\.com\//.test(u)||!p){$("setMsg").textContent="اكتب اللينك والرقم السري";return}
  $("setMsg").textContent="بجرّب…"; const old=cfg; cfg={url:u,pin:p};
  try{await api({action:"ping"});localStorage.setItem("cfg",JSON.stringify(cfg));$("setMsg").textContent="تمام ✓";show()}
  catch(e){cfg=old;$("setMsg").textContent=e.message==="pin"?"الرقم السري غلط":"اللينك مش شغال، اتأكد منه"}
};

/* ---------- تسجيل الصوت WAV ١٦ كيلوهرتز ---------- */
let ac=null, src=null, proc=null, stream=null, chunks=[], rate=48000, recT=null, recording=false;
async function startRec(){
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  ac=new (window.AudioContext||window.webkitAudioContext)(); await ac.resume(); rate=ac.sampleRate;
  src=ac.createMediaStreamSource(stream); proc=ac.createScriptProcessor(4096,1,1); chunks=[];
  proc.onaudioprocess=e=>chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  src.connect(proc); proc.connect(ac.destination);
  recording=true; recT=setTimeout(()=>{if(recording)$("mic").click()},90000);
}
function stopRec(){
  recording=false; clearTimeout(recT);
  try{proc.disconnect();src.disconnect()}catch(e){}
  stream.getTracks().forEach(t=>t.stop()); ac.close();
  let len=chunks.reduce((s,c)=>s+c.length,0), all=new Float32Array(len), o=0;
  chunks.forEach(c=>{all.set(c,o);o+=c.length});
  const ratio=rate/16000, n=Math.floor(len/ratio), pcm=new Int16Array(n);
  for(let i=0;i<n;i++){const a=Math.floor(i*ratio),b=Math.min(len,Math.floor((i+1)*ratio));let s=0;for(let k=a;k<b;k++)s+=all[k];
    const v=Math.max(-1,Math.min(1,s/Math.max(1,b-a)));pcm[i]=v<0?v*0x8000:v*0x7fff}
  const buf=new ArrayBuffer(44+pcm.length*2), dv=new DataView(buf);
  const w=(p,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(p+i,s.charCodeAt(i))};
  w(0,"RIFF");dv.setUint32(4,36+pcm.length*2,true);w(8,"WAVE");w(12,"fmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);
  dv.setUint16(22,1,true);dv.setUint32(24,16000,true);dv.setUint32(28,32000,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);
  w(36,"data");dv.setUint32(40,pcm.length*2,true);new Int16Array(buf,44).set(pcm);
  let bin="";const u8=new Uint8Array(buf);for(let i=0;i<u8.length;i+=8192)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));
  return {b64:btoa(bin),secs:n/16000};
}
$("mic").onclick=async()=>{
  const m=$("mic");
  if(m.classList.contains("busy")) return;
  if(!recording){
    try{await startRec();m.classList.add("rec");m.textContent="⏹";hint("بسمعك… اتكلم عادي ودوس لما تخلص")}
    catch(e){hint("لازم توافق على الميكروفون من إعدادات Safari",true)}
    return;
  }
  m.classList.remove("rec");m.classList.add("busy");m.textContent="⏳";
  const {b64,secs}=stopRec();
  if(secs<0.6){m.classList.remove("busy");m.textContent="🎤";hint("التسجيل قصير، جرّب تاني",true);return}
  hint("بفهم الكلام…");
  try{const r=await api({action:"parse",audio:b64,mime:"audio/wav",today:iso(new Date())});review(r)}
  catch(e){hint(e.message==="pin"?"الرقم السري اتغير، افتح الإعدادات":"محصلش فهم، جرّب تاني أو اكتب بإيدك",true)}
  m.classList.remove("busy");m.textContent="🎤";
};
$("goTyped").onclick=async()=>{
  const t=$("typed").value.trim(); if(!t) return;
  $("goTyped").disabled=true; hint("بفهم الكلام…");
  try{const r=await api({action:"parse",text:t,today:iso(new Date())});review(r)}
  catch(e){hint("محصلش فهم، جرّب تاني",true)}
  $("goTyped").disabled=false;
};

/* ---------- المراجعة ---------- */
function review(r){
  said=r.transcript||$("typed").value.trim(); draft=r.items||[];
  if(!draft.length){hint("مسمعتش مبلغ. قول الحاجة ومعاها سعرها",true);$("said").textContent=said;return}
  hint("راجع ودوس احفظ"); $("said").textContent=said?"«"+said+"»":"";
  $("day").value=iso(new Date()); $("review").hidden=false; drawItems();
  $("review").scrollIntoView({behavior:"smooth"});
}
function drawItems(){
  const box=$("items"); box.innerHTML="";
  draft.forEach((d,k)=>{
    const r=document.createElement("div"); r.className="it"+(d.type==="دخل"?" in":"");
    const t=document.createElement("input"); t.value=d.item; t.oninput=()=>d.item=t.value; t.setAttribute("aria-label","البند");
    const a=document.createElement("input"); a.type="number"; a.inputMode="decimal"; a.value=d.amount; a.setAttribute("aria-label","المبلغ");
    a.oninput=()=>{d.amount=+a.value||0;tot()};
    const x=document.createElement("button"); x.className="x"; x.textContent="×"; x.setAttribute("aria-label","شيل");
    x.onclick=()=>{draft.splice(k,1);drawItems()};
    const ty=document.createElement("select"); ["مصروف","دخل"].forEach(n=>ty.add(new Option(n,n,false,n===d.type)));
    const c=document.createElement("select");
    const fill=()=>{c.innerHTML="";(d.type==="دخل"?INC:CATS).forEach(n=>c.add(new Option(n,n,false,n===d.category)));d.category=c.value};
    fill(); c.onchange=()=>d.category=c.value; ty.onchange=()=>{d.type=ty.value;fill();drawItems()};
    const s=document.createElement("div"); s.className="sel"; s.append(ty,c);
    r.append(t,a,x,s); box.appendChild(r);
  });
  tot();
}
function tot(){$("tot").textContent=AR(draft.reduce((s,x)=>s+(+x.amount||0),0))+" ج"}
$("cancel").onclick=()=>{draft=[];$("review").hidden=true;hint("دوس واتكلم بالعامية، ودوس تاني لما تخلص")};
$("save").onclick=async()=>{
  const b=$("save"); b.disabled=true;
  const base=$("day").value||iso(new Date());
  const items=draft.filter(x=>+x.amount>0).map(x=>{const [y,m,d]=base.split("-").map(Number);
    return {id:(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()),date:iso(new Date(y,m-1,d+(x.day_offset||0))),
      type:x.type,item:(x.item||"").trim()||"مصروف",category:x.category,amount:+x.amount,said}});
  try{const r=await api({action:"save",items});hint("اتسجل "+DIG(r.saved)+" بند ✓");draft=[];$("review").hidden=true;$("typed").value="";loadRecent()}
  catch(e){hint("محصلش حفظ، دوس احفظ تاني",true)}
  b.disabled=false;
};
async function loadRecent(){
  try{const r=await api({action:"recent"}); const box=$("recent");
    box.innerHTML=r.rows.length?"":'<div class="empty">لسه مفيش</div>';
    r.rows.forEach(x=>{const d=document.createElement("div");d.className="rc"+(x.type==="دخل"?" in":"");
      const n=document.createElement("span");n.textContent=x.item;
      const v=document.createElement("b");v.textContent=(x.type==="دخل"?"+ ":"")+AR(x.amount);
      const s=document.createElement("small");s.textContent=dFull(x.date)+" · "+x.category+(x.status==="اتنقل"?" · في الدفتر ✓":"");
      d.append(n,v,s);box.appendChild(d)});
  }catch(e){}
}
show();
</script>
</body>
</html>
